}

  }

  --bg:#101316; --surface:#191D21; --surface-2:#1F242A;

  --ok:#7CC4A0; --ok-soft:#1A2A22; --ok-line:#3E6B55;

}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:660px;margin:0 auto;padding:0 18px 96px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
input,select{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);
  border-radius:9px;padding:11px 13px;width:100%}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- auth ---------- */
.authwrap{padding:56px 0 0;max-width:400px;margin:0 auto}
.authwrap h1{font-size:22px;text-align:center}
.authwrap>p{color:var(--muted);font-size:14px;text-align:center;margin:8px 0 26px}
.authcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:22px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:500}
.autherr{background:var(--no-soft);color:var(--no);border:1px solid var(--no-line);

.authcard .btn{width:100%}
.authtoggle{background:none;border:none;text-decoration:underline;text-underline-offset:3px;

.authnote{margin-top:16px;text-align:center;font-size:12.5px;color:var(--muted);line-height:1.6}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- home ---------- */
.masthead{padding:34px 0 22px;position:relative}
.masthead h1{font-size:25px;line-height:1.2}
.masthead p{margin:8px 0 0;color:var(--muted);font-size:14.5px;max-width:46ch}
.toolbtns{position:absolute;top:26px;right:18px;display:flex;gap:8px}
.iconbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);color:var(--muted);font-size:15px;line-height:1}
.userline{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.userline b{color:var(--ink);font-weight:500}
.userline .logout{text-decoration:underline;text-underline-offset:3px;color:var(--muted)}

.exam{
  display:block;width:100%;text-align:left;background:var(--accent);color:#fff;
  border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:8px;
}
:root[data-theme="dark"] .exam,
:root:not([data-theme="light"]) .exam{color:#0F1318}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .exam{color:#fff}}
.exam strong{display:block;font-size:17px;font-weight:600}
.exam span{font-size:13.5px;opacity:.85}
.sizes{display:flex;gap:8px;margin:10px 0 26px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;
  padding:6px 13px;font-size:13.5px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:500}
.chip.quiet{font-size:12.5px;padding:5px 11px}

.wrongbtn{display:block;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-left:3px solid var(--no);border-radius:var(--r);
  padding:14px 16px;margin-bottom:8px}
.wrongbtn:hover{background:var(--surface-2)}
.wrongbtn strong{display:block;font-size:16px;font-weight:600}
.wrongbtn span{font-size:13.5px;color:var(--muted)}
.emptywrong{margin:0 0 4px;font-size:13px;color:var(--muted);line-height:1.6;max-width:52ch}

.grouphead{font-size:12.5px;color:var(--muted);margin:26px 0 9px;font-weight:500}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  padding:13px 15px;border-bottom:1px solid var(--line);transition:background .12s}
.row:last-child{border-bottom:none}
.row:hover{background:var(--surface-2)}
.code{flex:0 0 auto;min-width:38px;text-align:center;font-family:"IBM Plex Mono",monospace;
  font-size:12px;font-weight:500;color:var(--accent);background:var(--accent-soft);
  border-radius:6px;padding:4px 6px}
.rowmain{flex:1 1 auto;min-width:0}
.rowmain b{display:block;font-weight:500;font-size:15px;line-height:1.35}
.rowmain small{color:var(--muted);font-size:12.5px}

.note{margin:30px 0 0;padding:14px 16px;border-left:2px solid var(--line);
  color:var(--muted);font-size:13px;line-height:1.6}

/* ---------- quiz ---------- */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 12px;margin:0 -18px;padding-left:18px;padding-right:18px}
.track{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.fill{height:100%;background:var(--accent);width:0;transition:width .25s ease}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:9px;
  font-size:12.5px;color:var(--muted)}
.meta .quit{color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.counter{font-family:"IBM Plex Mono",monospace}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:20px 19px;box-shadow:var(--shadow);margin-top:6px}
.ctx,.stempre{font-family:"IBM Plex Mono",monospace;font-size:12px;line-height:1.5;
  background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
  padding:11px 12px;overflow-x:auto;white-space:pre;margin:0 0 14px;color:var(--ink)}
.stem{font-size:17px;line-height:1.45;margin:0 0 16px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--line);
  border-radius:9px;padding:12px 13px;font-size:15px;line-height:1.45;
  transition:border-color .12s, background .12s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.letter{flex:0 0 auto;font-family:"IBM Plex Mono",monospace;font-size:12.5px;
  color:var(--muted);padding-top:2px;text-transform:lowercase}
.opt.good{background:var(--ok-soft);border-color:var(--ok-line);border-left-color:var(--ok)}
.opt.good .letter{color:var(--ok)}
.opt.bad{background:var(--no-soft);border-color:var(--no-line);border-left-color:var(--no)}
.opt.bad .letter{color:var(--no)}
.opt.dim{opacity:.55}
.verdict{margin-top:15px;font-size:14px;display:flex;gap:8px;align-items:baseline}
.verdict b{font-weight:600}
.verdict.good b{color:var(--ok)}
.verdict.bad b{color:var(--no)}
.flag{margin-top:11px;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}

.next{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 65%,transparent);display:none}
.next.on{display:block}
.next button{display:block;max-width:660px;margin:0 auto;width:100%;background:var(--accent);
  color:var(--surface);border-radius:10px;padding:14px;font-size:15.5px;font-weight:500;box-shadow:var(--shadow)}
:root[data-theme="dark"] .next button{color:#0F1318}

/* ---------- results ---------- */
.result{text-align:center;padding:40px 0 10px}
.big{font-family:"IBM Plex Mono",monospace;font-size:52px;font-weight:500;line-height:1;letter-spacing:-.03em}
.pct{color:var(--muted);margin-top:10px;font-size:15px}
.verdictline{margin:18px auto 0;max-width:38ch;color:var(--muted);font-size:14.5px}
.savestate{margin:10px auto 0;max-width:38ch;color:var(--muted);font-size:12.5px}
.badgebox{margin:22px auto 0;max-width:40ch}
.badgewin{background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold-soft);
  border-radius:10px;padding:12px 14px;font-size:16px;font-weight:600}
.badgewin.muted{background:var(--surface-2);color:var(--muted);font-weight:500;font-size:14.5px;border-color:var(--line)}
.badgehint{margin:9px 0 0;font-size:13px;color:var(--muted)}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:30px}
.btn{border-radius:10px;padding:13px;font-size:15px;font-weight:500;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.btn:disabled{opacity:.6;cursor:default}
:root[data-theme="dark"] .btn.primary{color:#0F1318}
.review{margin-top:34px}
.review h3{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:10px}
.rev{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:9px;font-size:14px}
.rev .rq{line-height:1.4}
.rev .ra{margin-top:7px;color:var(--ok);font-size:13.5px}
.rev .rm{margin-top:3px;color:var(--no);font-size:13.5px}
.hide{display:none}

/* ---------- leaderboard ---------- */
.lbhead{padding:30px 0 6px;position:relative}
.lbhead h1{font-size:22px}
.lbhead p{margin:6px 0 0;color:var(--muted);font-size:13.5px}
.lbback{position:absolute;top:30px;right:18px;font-size:13px;color:var(--muted);
  text-decoration:underline;text-underline-offset:3px}
.lbfilter{margin:16px 0 14px}
.lbrow{display:flex;align-items:center;gap:12px;padding:12px 15px;border-bottom:1px solid var(--line)}
.lbrow:last-child{border-bottom:none}
.lbrank{flex:0 0 auto;width:24px;text-align:center;font-family:"IBM Plex Mono",monospace;
  font-size:13px;color:var(--muted)}
.lbrow:nth-child(1) .lbrank,.lbrow:nth-child(2) .lbrank,.lbrow:nth-child(3) .lbrank{color:var(--gold);font-weight:600}
.lbmain{flex:1 1 auto;min-width:0}
.lbmain b{display:block;font-size:14.5px;font-weight:500}
.lbmain small{color:var(--muted);font-size:12px}
.lbpct{flex:0 0 auto;font-family:"IBM Plex Mono",monospace;font-size:13.5px;
  background:var(--gold-soft);color:var(--gold);border-radius:99px;padding:3px 10px}
.lbempty{padding:30px 16px;text-align:center;color:var(--muted);font-size:14px}
.lberr{padding:16px;color:var(--no);font-size:13.5px}
</style>

["L’elasticità incrociata della domanda rispetto al prezzo esprime, in valore assoluto, la variazione percentuale della domanda del bene A per effetto di una certa variazione percentuale del prezzo del medesimo bene A.","Prodotti che appartengono ad aree strategiche d’affari diverse sono caratterizzati da valori dell’elasticità incrociata della domanda rispetto al prezzo nulli o bassi.","Prodotti che appartengono alla stessa area strategica d’affari sono caratterizzati da valori elevati dell’elasticità incrociata della domanda rispetto al prezzo."],"a":0},{"s":"Quale delle seguenti affermazioni è falsa?","p":0,"o":["Il numero di prodotti finiti che compongono una certa linea di prodotti prende il nome di profondità della linea.","Il numero di prodotti che compongono la gamma di prodotti di un’azienda prende il nome di ampiezza della gamma.","Il numero di prodotti che compongono la gamma di prodotti di un’azienda prende il nome di estensione della gamma.","A parità di estensione della gamma, al crescere dell’ampiezza della gamma diminuisce la profondità media delle linee di prodotto."],"a":1},{"s":"Quale delle seguenti affermazioni è falsa?","p":0,"o":["La redditività del capitale investito in una certa area strategica d’affari è un indicatore di efficacia.","Ceteris paribus, l’attrattività di una certa area strategica d’affari cresce al crescere della redditività del capitale investito in quell’area.","Ceteris paribus, l’attrattività di una certa area strategica d’affari cresce al crescere della stabilità della redditività del capitale investito in quell’area."],"a":2,"d":1},{"s":"Quale delle seguenti affermazioni è falsa?","p":0,"o":["Il potere contrattuale dei clienti e il potere contrattuale dei fornitori sono alcuni dei fattori che influenzano l’attrattività di una certa area strategica d’affari.","Una certa area strategica d’affari è tanto più attrattiva quanto più alto è il potere contrattuale dei clienti in quell’area.","L’attrattività di una certa area strat uto che il prodotto dà alla copertura dei costi fissi totali dell’azienda e, una volta coperti questi costi e nell’ipotesi di azienda monoprodotto, alla generazione di utili."],"a":0},{"s":"Con riferimento a un prodotto venduto da un’azienda, quale delle seguenti affermazioni è vera?","p":0,"o":["Il margine di contribuzione semplice è sempre maggiore del margine di contribuzione evoluto.","Il margine di contribuzione semplice è sempre maggiore o eguale al margine di contribuzione evoluto.","Un margine di contribuzione evoluto positivo esprime il contributo che il prodotto dà alla copertura di tutti i costi fissi totali dell’azienda e, eventualmente, alla generazione di utili."],"a":1},{"s":"Con riferimento a un prodotto venduto da un’azienda, quale delle seguenti affermazioni è vera?","p":0,"o":["Il margine di contribuzione evoluto è sempre maggiore del margine di contribuzione semplice.","Il margine di contribuzione evoluto è sempre minore del margine di contribuzione semplice.","Un margine di contribuzione evoluto positivo esprime il contributo che il prodotto dà alla copertura dei costi fissi totali dell’azienda.","Se il margine di contribuzione evoluto è positivo, esprime il contributo che la vendita del prodotto dà alla copertura dei costi fissi totali dell’azienda non direttamente attribuibili al prodotto."],"a":3},{"s":"Qual è la definizione di margine di contribuzione complessivo evoluto di un prodotto?","p":0,"o":["Ricavi totali di un prodotto meno costi totali del prodotto.","Ricavi totali di un prodotto meno costi variabili totali del prodotto.","Ricavi totali di un prodotto meno costi fissi diretti totali del prodotto.","Ricavi totali di un prodotto meno costi variabili totali e costi fissi diretti totali del prodotto."],"a":3},{"s":"Quale delle seguenti affermazioni è falsa?","p":0,"o":["Il margine di contribuzione evoluto non è mai superiore al margine di contribuzione semplice.","Conviene sempre produrre e vendere un prodotto con margine di contribuzi const esc = s => s.replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
const displayNameOf = u => (u && u.displayName && u.displayName.trim()) ? u.displayName.trim() : 'Utente Anonimo';

/* ================= AUTH ================= */
let authMode = 'login'; // 'login' | 'register'
function mapAuthError(code){
  switch(code){
    case 'auth/invalid-email': return 'Indirizzo email non valido.';
    case 'auth/user-not-found': return 'Nessun account con questa email. Registrati prima di accedere.';
    case 'auth/wrong-password':
    case 'auth/invalid-credential': return 'Email o password non corrette.';
    case 'auth/email-already-in-use': return 'Esiste già un account con questa email. Prova ad accedere.';
    case 'auth/weak-password': return 'La password deve avere almeno 6 caratteri.';
    case 'auth/missing-password': return 'Inserisci una password.';
    case 'auth/too-many-requests': return 'Troppi tentativi. Riprova tra qualche minuto.';
    default: return 'Si è verificato un errore. Riprova.';
  }
}
function authScreen(){
  nextbar.classList.remove('on');
  window.scrollTo(0,0);
  const isRegister = authMode === 'register';
  app.innerHTML = `
  <div class="authwrap">
    <h1>Domande chiuse EOA</h1>
    <p>${isRegister ? 'Crea un account per fare il quiz e sbloccare i badge.' : 'Accedi per fare il quiz e salvare i tuoi progressi.'}</p>
    <div class="authcard">
      ${isRegister ? `<div class="field"><label for="authUser">Nome utente</label>
        <input id="authUser" type="text" autocomplete="nickname" maxlength="30" placeholder="Come apparirai in classifica"></div>` : ''}
      <div class="field"><label for="authEmail">Email</label>
        <input id="authEmail" type="email" autocomplete="email" placeholder="nome@esempio.it"></div>
      <div class="field"><label for="authPwd">Password</label>
        <input id="authPwd" type="password" autocomplete="${isRegister?'new-password':'current-password'}" placeholder="Almeno 6 caratteri"></div>
      <div id="authErr" class="autherr hide"></div>
      <button class="btn primary" id="authSubmit">${isRegister ? 'Crea account' : 'Accedi'}</button>
      <button class="authtoggle" id="authToggle">${isRegister ? 'Hai già un account? Accedi' : 'Non hai un account? Registrati'}</button>
    </div>
    <p class="authnote">Il nome utente scelto in fase di registrazione è quello che comparirà nella classifica delle simulazioni: email e password restano privati.</p>
  </div>`;
  const errBox = app.querySelector('#authErr');
  const showErr = msg => { errBox.textContent = msg; errBox.classList.remove('hide'); };
  const emailEl = app.querySelector('#authEmail');
  const pwdEl = app.querySelector('#authPwd');
  const userEl = app.querySelector('#authUser');

  app.querySelector('#authToggle').onclick = () => { authMode = isRegister ? 'login' : 'register'; authScreen(); };

  app.querySelector('#authSubmit').onclick = async () => {
    errBox.classList.add('hide');
    const email = emailEl.value.trim(), pwd = pwdEl.value;
    const username = userEl ? userEl.value.trim() : '';
    if(isRegister && !username){ showErr('Scegli un nome utente.'); return; }
    if(!email || !pwd){ showErr('Inserisci email e password.'); return; }
    const btn = app.querySelector('#authSubmit');
    btn.disabled = true; app.querySelector('#authToggle').disabled = true;
    btn.innerHTML = '<span class="spin"></span>Attendi…';
    suppressAuthRender = true;
    try{
      if(isRegister){
        const cred = await createUserWithEmailAndPassword(auth, email, pwd);
        await updateProfile(cred.user, { displayName: username });
        currentUser = auth.currentUser;
      } else {
        const cred = await signInWithEmailAndPassword(auth, email, pwd);
        currentUser = cred.user;
      }
      suppressAuthRender = false;
      await afterAuthReady();
    }catch(e){
      suppressAuthRender = false;
      showErr(mapAuthError(e.code));
      btn.disabled = false; app.querySelector('#authToggle').disabled = false;
      btn.textContent = isRegister ? 'Crea account' : 'Accedi';
    }
  };
  [emailEl,pwdEl,userEl].filter(Boolean).forEach(el => el.addEventListener('keydown', e => {
    if(e.key==='Enter') app.querySelector('#authSubmit').click();
  }));
}
function doLogout(){ signOut(auth); }

/* ================= BADGES (Firestore: userProgress/{uid}) ================= */
async function loadUserProgress(uid){
  try{
    const snap = await getDoc(doc(db, 'userProgress', uid));
    userProgress = snap.exists() ? (snap.data().progress || {}) : {};
  }catch(e){
    console.error('Errore nel caricamento dei progressi:', e);
    userProgress = {};
  }
}
/* Saves a new personal-best percentage (and its badge) for a chapter, but ONLY if it beats
   the stored bestScore (or there is no record yet). Ties and lower scores never write.
   Returns {updated, bestScore, badge}. */
async function registerChapterAttempt(code, pct){
  const prev = userProgress[code];
  const prevBest = prev ? prev.bestScore : -1;
  if(pct <= prevBest){
    return { updated:false, bestScore: prevBest, badge: prev ? prev.badge : null };
  }
  const badge = badgeFor(pct);
  const entry = { badge: badge || null, bestScore: pct };
  userProgress[code] = entry;
  try{
    await setDoc(doc(db, 'userProgress', currentUser.uid), { [`progress.${code}`]: entry }, { merge:true });
  }catch(e){ console.error('Errore nel salvataggio del progresso:', e); }
  return { updated:true, bestScore: pct, badge };
}

async function loadBoard(size, box){
  box.innerHTML = `<div class="lbempty"><span class="spin"></span>Caricamento…</div>`;
  try{
    const qy = query(collection(db, 'leaderboard'),
      where('chapter','==', examLabel(size)), orderBy('percentage','desc'), limit(20));
    const snap = await getDocs(qy);
    if(snap.empty){ box.innerHTML = `<div class="lbempty">Nessun punteggio salvato ancora per questa simulazione.</div>`; return; }
    box.innerHTML = snap.docs.map((d,i)=>{
      const v = d.data();
      return `<div class="lbrow"><span class="lbrank">${i+1}</span>
        <span class="lbmain"><b>${esc(v.username || 'Utente Anonimo')}</b><small>${v.score}/${v.total}</small></span>
        <span class="lbpct">${v.percentage}%</span></div>`;
    }).join('');
  }catch(e){
    console.error('Errore nel caricamento della classifica:', e);
    box.innerHTML = `<div class="lberr">Impossibile caricare la classifica (controlla connessione e regole/indici Firestore).</div>`;
  }
}

/* ================= HOME ================= */
/* Renders the two chapter groups against a given progress snapshot (badge + record % per
   chapter code). Takes progressData explicitly rather than reading the module-level
   userProgress directly, so it's obvious this can only run once that data has arrived —
   see afterAuthReady(), which is the only place allowed to call home(). */
function renderChaptersUI(progressData){
  // Defensive unwrap: accept either the raw Firestore doc shape ({ progress: {...} }) or an
  // already-unwrapped map ({ [code]: {...} }), and never throw on undefined/null input.
  const progressMap = (progressData && typeof progressData === 'object' && progressData.progress
    && typeof progressData.progress === 'object') ? progressData.progress
    : (progressData && typeof progressData === 'object' ? progressData : {});

  // Defensive key lookup: chapter codes (c.code, e.g. "F1A") are the keys we write to Firestore
  // in registerChapterAttempt via `progress.${code}`, so that's what must match here too — NOT
  // the chapter title. Build a normalized (trimmed, lowercased) index once, so a stray space or
  // case difference in a stored key still resolves instead of silently showing no badge.
  const normalizedIndex = {};
  Object.keys(progressMap).forEach(k => { normalizedIndex[String(k).trim().toLowerCase()] = progressMap[k]; });
  const lookupProgress = code => progressMap[code] ?? normalizedIndex[String(code).trim().toLowerCase()];

  // Tailwind row: 4 aligned columns — chapter (flexes, truncates), badge, record %, action.
  // Colors reference the app's existing CSS custom properties (bg-[var(--surface)] etc.) via
  // Tailwind's arbitrary-value syntax, so rows stay correct in both light and dark theme.
  const renderRow = (c,i) => {
    const p = lookupProgress(c.code);
    const badgeCell = (p && p.badge)
      ? `<span class="text-lg leading-none" aria-hidden="true">${BADGE_EMOJI[p.badge]}</span>`
      : `<span class="inline-block h-2 w-2 rounded-full bg-[var(--line)]" title="Nessun badge"></span>`;
    const pctText = p ? `${p.bestScore}%` : '0%';
    return `
    <button type="button" data-ch="${i}"
      class="group flex w-full items-center gap-2 sm:gap-4 rounded-xl border border-[var(--line)]
             bg-[var(--surface)] px-3 sm:px-4 py-3 text-left shadow-sm
             transition-colors hover:bg-[var(--surface-2)] hover:border-[var(--accent)]">
      <span class="min-w-0 flex-1">
        <span class="block truncate text-[15px] font-medium text-[var(--ink)]">${esc(c.title)}</span>
        <span class="block truncate text-xs text-[var(--muted)]">${c.code} · ${c.q.length} domande</span>
      </span>
      <span class="flex w-6 flex-none items-center justify-center">${badgeCell}</span>
      <span class="w-10 flex-none text-right font-mono text-xs sm:text-sm text-[var(--muted)]">${pctText}</span>
      <span class="flex-none inline-flex items-center gap-1 rounded-full bg-[var(--accent-soft)]
                   px-2.5 sm:px-3 py-1 text-xs font-medium text-[var(--accent)]
                   transition-transform group-hover:translate-x-0.5">
        <span class="hidden sm:inline">Gioca</span>
        <span aria-hidden="true">→</span>
      </span>
    </button>`;
  };

  const grp = (pred,label) => {
    const rows = DATA.map((c,i)=>[c,i]).filter(([c])=>pred(c.code));
    return `<div class="grouphead">${label}</div>
    <div class="flex flex-col gap-2">${rows.map(([c,i])=>renderRow(c,i)).join('')}</div>`;
  };
  return grp(c=>c[0]==='F', 'Funzioni aziendali') + grp(c=>c[0]==='C', 'Costi e controllo di gestione');
}

/* ================= QUIZ ================= */
let S = null;
function start(list, title, key, mode, meta){
  const items = list.map(q => {
    const ord = q.o.map((_,k)=>k);
    return { q, ord: mixOpts ? shuffle(ord) : ord };
  });
  S = { items, title, key, mode, meta: meta||{}, i:0, right:0, wrong:[] };
  render();
}
function render(){
  const it = S.items[S.i], q = it.q, n = S.items.length;
  window.scrollTo(0,0);
  nextbar.classList.remove('on');
  app.innerHTML = `
  <div class="bar">
    <div class="track"><div class="fill" style="width:${S.i/n*100}%"></div></div>
    <div class="meta"><span class="counter">Domanda ${S.i+1} di ${n}</span>
      <button class="quit" id="quit">Esci</button></div>
  </div>
  <div class="card">
    ${q.c ? `<pre class="ctx">${esc(q.c)}</pre>` : ''}
    ${q.p ? `<pre class="stempre">${esc(q.s)}</pre>` : `<p class="stem">${esc(q.s)}</p>`}
    <div class="opts">
      ${it.ord.map((orig,pos)=>`<button class="opt" data-pos="${pos}"><span class="letter">${L[pos]}</span><span>${esc(q.o[orig])}</span></button>`).join('')}
    </div>
    <div id="fb"></div>
  </div>`;
  app.querySelector('#quit').onclick = () => { if(confirm('Vuoi uscire dal quiz? I progressi andranno persi.')) home(); };
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.pos));
}
function answer(pos){
  const it = S.items[S.i], q = it.q;
  const picked = it.ord[pos];
  const goodPos = it.ord.indexOf(q.a);
  const ok = picked === q.a;
  if(ok){ S.right++; clearWrong(q.id); }
  else { S.wrong.push({q, picked}); markWrong(q.id); }
  app.querySelectorAll('.opt').forEach((b,j)=>{
    b.disabled = true;
    if(j === goodPos) b.classList.add('good');
    else if(j === pos) b.classList.add('bad');
    else b.classList.add('dim');
  });
  app.querySelector('#fb').innerHTML = `<div class="verdict ${ok?'good':'bad'}">
      <b>${ok ? 'Corretta.' : 'Sbagliata.'}</b>
      <span>${ok ? '' : 'La risposta giusta è la ' + L[goodPos] + '.'}</span></div>
    ${q.v ? `<div class="flag">Questa risposta è stata ricostruita e non è confermata dalle soluzioni: verificala sulle dispense.</div>` : ''}`;
  app.querySelector('.fill').style.width = ((S.i+1)/S.items.length*100) + '%';
  nextbtn.textContent = (S.i+1 < S.items.length) ? 'Avanti' : 'Vedi il risultato';
  nextbar.classList.add('on');
}
nextbtn.onclick = () => { if(S.i+1 < S.items.length){ S.i++; render(); } else results(); };

/* ================= FIRESTORE: leaderboard (solo simulazioni) ================= */
async function saveToLeaderboard(right, n, pct, title){
  if(!currentUser) return { ok:false };
  try{
    await addDoc(collection(db, 'leaderboard'), {
      userId: currentUser.uid,
      username: displayNameOf(currentUser),
      score: right,
      total: n,
      percentage: pct,
      chapter: title,
      createdAt: serverTimestamp()
    });
    return { ok:true };
  }catch(e){
    console.error('Errore nel salvataggio su Firestore:', e);
    return { ok:false };
  }
}

/* ================= RESULTS ================= */
function reviewHtml(){
  if(!S.wrong.length) return '';
  return `<div class="review"><h3>Da rivedere (${S.wrong.length})</h3>${
    S.wrong.map(w=>`<div class="rev">
      <div class="rq">${esc(w.q.p ? w.q.s.replace(/\s{2,}/g,' ').slice(0,180) : w.q.s)}</div>
      <div class="ra">${esc(w.q.o[w.q.a])}</div>
      <div class="rm">tu: ${esc(w.q.o[w.picked])}</div>
    </div>`).join('')}</div>`;
}
function results(){
  nextbar.classList.remove('on');
  window.scrollTo(0,0);
  const n = S.items.length, pct = Math.round(S.right/n*100);

  if(S.mode === 'exam'){
    saveScore(S.key, pct);
    app.innerHTML = `
    <div class="result">
      <div class="big">${S.right}/${n}</div>
      <div class="pct">${pct}% di risposte corrette</div>
      <p class="verdictline">Il punteggio di questa simulazione entra in classifica.</p>
      <p class="savestate" id="savestate"><span class="spin"></span>Salvataggio del punteggio…</p>
    </div>
    <div class="actions">
      <button class="btn primary" id="tolb">Vedi Classifica</button>
      <button class="btn" id="back">Torna alla Home</button>
    </div>
    ${reviewHtml()}`;
    saveToLeaderboard(S.right, n, pct, S.title).then(r => {
      const el = app.querySelector('#savestate');
      if(!el) return;
      el.innerHTML = r.ok ? 'Punteggio salvato in classifica.' : 'Impossibile salvare il punteggio (nessuna connessione o permessi Firestore).';
    });
    app.querySelector('#tolb').onclick = () => leaderboardScreen(S.meta.examSize);
    app.querySelector('#back').onclick = home;

  } else if(S.mode === 'chapter'){
    app.innerHTML = `
    <div class="result">
      <div class="big">${S.right}/${n}</div>
      <div class="pct">${pct}% di risposte corrette</div>
      <div class="badgebox" id="badgebox">
        <div class="badgewin muted"><span class="spin"></span>Calcolo il badge…</div>
      </div>
    </div>
    <div class="actions">
      <button class="btn primary" id="again">Riprova questo capitolo</button>
      <button class="btn" id="back">Torna alla Home</button>
    </div>
    ${reviewHtml()}`;
    registerChapterAttempt(S.meta.code, pct).then(({updated, bestScore, badge}) => {
      const el = app.querySelector('#badgebox');
      if(!el) return;
      if(updated){
        el.innerHTML = badge
          ? `<div class="badgewin">Nuovo record: ${bestScore}%! Badge ${BADGE_LABEL[badge]} ${BADGE_EMOJI[badge]}</div>
             ${badge!=='oro' ? `<p class="badgehint">Riprova questo capitolo per puntare al Badge Oro 🥇.</p>` : ''}`
          : `<div class="badgewin muted">Nuovo record: ${bestScore}%. Serve almeno il 40% per il Bronzo 🥉.</div>`;
      } else if(badge){
        el.innerHTML = `<div class="badgewin muted">Il tuo record per questo capitolo resta ${bestScore}% — Badge ${BADGE_LABEL[badge]} ${BADGE_EMOJI[badge]}</div>
          ${badge!=='oro' ? `<p class="badgehint">Riprova per puntare a un badge più alto.</p>` : ''}`;
      } else if(bestScore >= 0){
        el.innerHTML = `<div class="badgewin muted">Il tuo record per questo capitolo resta ${bestScore}%: serve almeno il 40% per il Bronzo 🥉.</div>`;
      } else {
        el.innerHTML = `<div class="badgewin muted">Nessun badge questa volta: serve almeno il 40% per il Bronzo 🥉.</div>`;
      }
    });
    app.querySelector('#again').onclick = () => start(DATA[S.meta.index].q.slice(), S.title, S.key, 'chapter', S.meta);
    app.querySelector('#back').onclick = home;

  } else { // wrong
    const left = loadWrong().length;
    app.innerHTML = `
    <div class="result">
      <div class="big">${S.right}/${n}</div>
      <div class="pct">${pct}% di risposte corrette</div>
      <p class="verdictline">${left ? `Restano ${left} domande nell'elenco delle sbagliate.` : 'Elenco delle sbagliate azzerato: le hai recuperate tutte.'}</p>
    </div>
    <div class="actions">
      <button class="btn primary" id="again">Riprova le sbagliate</button>
      <button class="btn" id="back">Torna alla Home</button>
    </div>
    ${reviewHtml()}`;
    app.querySelector('#again').onclick = () => {
      const l = loadWrong().map(id=>BYID[id]);
      if(!l.length) return home();
      start(shuffle(l), 'Solo le sbagliate', null, 'wrong', {});
    };
    app.querySelector('#back').onclick = home;
  }
}

/* ================= BOOT ================= */
/* Shown the instant we know who's logged in, before the userProgress document has arrived
   from Firestore — so a slow network never has a chance to paint chapters without their
   badges. home() itself is only ever called from afterAuthReady(), once getDoc has resolved. */
function loadingScreen(){
  nextbar.classList.remove('on');
  app.innerHTML = `<div class="result"><p class="savestate"><span class="spin"></span>Caricamento in corso…</p></div>`;
}
async function afterAuthReady(){
  const myRequest = ++authRequestId; // if another auth change starts while we await below, this run is stale
  if(currentUser){
    loadingScreen();
    await loadUserProgress(currentUser.uid); // populates userProgress from userProgress/{uid} in Firestore
    if(myRequest !== authRequestId) return;  // a newer auth state resolved first; let that one render instead
    home();
  } else {
    userProgress = {};
    if(myRequest !== authRequestId) return;
    authScreen();
  }
}
onAuthStateChanged(auth, async user => {
  currentUser = user;
  if(suppressAuthRender) return;
  await afterAuthReady();
});
</script>
